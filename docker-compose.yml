version: '3.9'
services:
    db:
        image: mcr.microsoft.com/mssql/server:2022-latest
        environment:
            SA_PASSWORD: ${SA_PASSWORD}
            ACCEPT_EULA: "Y"
        volumes:
            - mssql_data:/var/opt/mssql
        ports:
            - "1433:1433"

    backend:
        build: ./Merum-BE
        ports:
            - "5000:80"
        environment:
            - ASPNETCORE_URLS=http://+:80
            - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
        volumes:
            - pics_data:/app/Pics
        depends_on:
            - db

    frontend:
        build: ./merum-fe
        ports:
            - "4200:80"
        depends_on:
            - backend

volumes:
    mssql_data:
    pics_data: