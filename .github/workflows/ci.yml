name: Merum Build, Test, Deploy

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

env:
    REGISTRY: ghcr.io
    IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/merum

jobs:
    backend:
        name: Build & Test .NET Backend API
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Check Backend
              run: echo "Backend works"
    frontend:
        name: Build & Test Angular Frontend
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Check Frontend
              run: echo "Frontend works"
    terraform:
        name: Terraform Format & Validate
        runs-on: ubuntu-latest
        steps:
            - name: Check Terraform
              run: echo "Terraform works"

    deploy-local:
        name: Deploy to local Docker
        if: github.ref == 'refs/heads/master'
        needs: [backend, frontend, terraform]
        runs-on: [self-hosted, merum-local]
        steps:
            - name: Check Deploy
              run: echo "Deploy works"