<div class="container">
    <h2>Add Wine</h2>
    <form (ngSubmit)="onSubmit()" #wineForm="ngForm">
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" class="form-control" required maxlength="20" [(ngModel)]="addWineDTO.name" name="name">
      </div>
      <div class="form-group">
        <label for="year">Year:</label>
        <input type="number" id="year" class="form-control" [(ngModel)]="addWineDTO.year" name="year">
      </div>
      <div class="form-group">
        <label for="alcohol">Alcohol:</label>
        <input type="number" id="alcohol" class="form-control" [(ngModel)]="addWineDTO.alcohol" name="alcohol">
      </div>
      <div class="form-group">
        <label for="locationEntityId">Location Entity ID:</label>
        <input type="number" id="locationEntityId" class="form-control" [(ngModel)]="addWineDTO.locationEntityId" name="locationEntityId">
      </div>
      <button type="submit" class="btn btn-primary">Add Wine</button>
    </form>
  </div>
