<div class="wine-list-header">
  <div class="wine-filter-container" (change)="onFilterChanged()">
    <div class="selector">
      <label for="location">Régió:</label>
      <select id="location" name ="location" [(ngModel)]="selectedLocation">
        @for (l of locations; track l) {
          <option [value]="l">{{l || 'Összes'}}</option>
        }
      </select>
    </div>
    <div class="selector">
      <label for="grapeVariety">Szőlőfajta:</label>
      <select id="grapeVariety" name="grapeVariety" [(ngModel)]="selectedGrapeVariety">
        @for (gv of grapeVarieties; track gv) {
          <option [value]="gv">{{gv || 'Összes' }}</option>
        }
      </select>
    </div>
    <div class="selector">
      <label for="year">Évjárat:</label>
      <select id="year" name="year" [(ngModel)]="selectedYear">
        @for (y of yearsWithAllSelector; track y) {
          <option [value]="y">{{y}}</option>
        }
      </select>
    </div>
  </div>
  @if (this.authService.isLoggedIn()){
    <div class="admin-controls">
      <button class="add-wine-button" [routerLink]="['/borok/hozzaadas']">Bor hozzáadása</button>
      <div class="selector">
        <label for="archived">Archív mutatása:</label>
        <input type="checkbox" id="archived" name="archived" [checked]="showArchived" (change)="onToggleArchived($event)">
      </div>
    </div>
  }
</div>
<div class="wine-list">
  @for(wine of wines; track wine.id){
    <app-wine-card [wine] = "wine" [@fadeWineList]></app-wine-card>
  }
</div>
