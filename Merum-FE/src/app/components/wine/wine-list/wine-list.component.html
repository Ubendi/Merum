    <div class="selector">
        <label for="grapeVariety">Szőlőfajta:</label>
        <select id="grapeVariety" name="grapeVariety">
            <option *ngFor="let gv of grapeVarieties" [value]="gv">{{gv}}</option>
        </select>
    </div>
    <div class="selector">
        <label for="year">Évjárat:</label>
        <select id="year" name="year">
            <option *ngFor="let y of years" [value]="y">{{y}}</option>
        </select>
    </div>
</div>
<div class="wine-list">
    <app-wine-card *ngFor="let wine of wines" [wine] = "wine"></app-wine-card>
</div>
<button [routerLink]="['/borok/hozzaadas']">Bor hozzáadása</button>
