<div class="wine-list-header">
    <div class="wine-filter-container" (change)="onFilterChanged()">
        <div class="selector">
            <mat-label for="location">Régió:</mat-label>
            <select id="location" name ="location" [(ngModel)]="selectedLocation">
                <option *ngFor="let l of locations" [value]="l">{{l || 'Összes'}}</option>
            </select>
        </div>
        <div class="selector">
            <label for="grapeVariety">Szőlőfajta:</label>
            <select id="grapeVariety" name="grapeVariety" [(ngModel)]="selectedGrapeVariety">
                <option *ngFor="let gv of grapeVarieties" [value]="gv">{{gv || 'Összes' }}</option>
            </select>
        </div>
        <div class="selector">
            <label for="year">Évjárat:</label>
            <select id="year" name="year" [(ngModel)]="selectedYear">
                <option *ngFor="let y of yearsWithAllSelector" [value]="y">{{y}}</option>
            </select>
        </div>
    </div>
</div>
<div class="wine-list">
    @for(wine of wines; track wine.id){
        <app-wine-card [wine] = "wine" [@fadeWineList]></app-wine-card>
    }
</div>
@if (this.authService.isLoggedIn()){
    <div clas="wine-list-controls">
       <button [routerLink]="['/borok/hozzaadas']" style="margin-left: auto;">Bor hozzáadása</button>
    </div>
}
