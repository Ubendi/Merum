<div class="container">
    <h2>Szerk </h2>
    <form (ngSubmit)="onSubmit()" #wineForm="ngForm">
      <div class="form-group">
        <label for="name">Név:</label>
        <input type="text" id="name" class="form-control" required maxlength="50" [(ngModel)]="wine.name" name="name">
      </div>
      <div class="form-group">
        <label for="year">Évjárat:</label>
        <input type="number" id="year" class="form-control" [(ngModel)]="wine.year" name="year">
      </div>
      <div class="form-group">
        <label for="description">Leírás:</label>
        <input type="string" id="description" class="form-control" [(ngModel)]="wine.description" name="description">
      </div>
      <div class="form-group">
        <label for="locationEntityId">Régió:</label>
        <select id="location" [(ngModel)]="wine.location.name" name="location" required>
          <option *ngFor="let location of locations" [value]="location.id">{{ location.name }}</option>
        </select>
      </div>
      <div class="form-group">
        <label for="relativeDens">Relatív sűrűség:</label>
        <input type="number" id="relativeDens" class="form-control" [(ngModel)]="wine.relativeDens" name="relativeDens">
      </div>
      <div class="form-group">
        <label for="totalAlc">Összes alkoholtartalom:</label>
        <input type="number" id="totalAlc" class="form-control" [(ngModel)]="wine.totalAlc" name="totalAlc">
      </div>
      <div class="form-group">
        <label for="realAlc">Tényleges alkohol:</label>
        <input type="number" id="realAlc" class="form-control" [(ngModel)]="wine.realAlc" name="realAlc">
      </div>
      <div class="form-group">
        <label for="totalExtract">Összes extrakt:</label>
        <input type="number" id="totalExtract" class="form-control" [(ngModel)]="wine.totalExtract" name="totalExtract">
      </div>
      <div class="form-group">
        <label for="totalAcid">Összes sav:</label>
        <input type="number" id="totalAcid" class="form-control" [(ngModel)]="wine.totalAcid" name="totalAcid">
      </div>
      <div class="form-group">
        <label for="volatileAcid">Illósav:</label>
        <input type="number" id="volatileAcid" class="form-control" [(ngModel)]="wine.volatileAcid" name="volatileAcid">
      </div>
      <div class="form-group">
        <label for="totalSDiox">Összes kéndioxid:</label>
        <input type="number" id="totalSDiox" class="form-control" [(ngModel)]="wine.totalSDiox" name="totalSDiox">
      </div>
      <div class="form-group">
        <label for="freeSDiox">Szabad kéndioxid:</label>
        <input type="number" id="freeSDiox" class="form-control" [(ngModel)]="wine.freeSDiox" name="freeSDiox">
      </div>
      <div class="form-group">
        <label for="totalSugar">Összes cukor:</label>
        <input type="number" id="totalSugar" class="form-control" [(ngModel)]="wine.totalSugar" name="totalSugar">
      </div>
      <div class="form-group">
        <label for="sugarFreeExtract">Cukormentes extrakt:</label>
        <input type="number" id="sugarFreeExtract" class="form-control" [(ngModel)]="wine.sugarFreeExtract" name="sugarFreeExtract">
      </div>
      <div class="form-group">
        <label for="titratableAcid">Titrálható sav:</label>
        <input type="number" id="titratableAcid" class="form-control" [(ngModel)]="wine.titratableAcid" name="titratableAcid">
      </div>
      <div class="form-group"> 
        <label for="ph">PH:</label>
        <input type="number" id="ph" class="form-control" [(ngModel)]="wine.ph" name="ph">
      </div>
      <div class="form-group">
        <label for="picture">Kép</label>
        <input type="file" (change)="onPictureSelected($event)">
      </div>
      <button type="submit" class="btn btn-primary">Kész</button>
    </form>
  </div>
