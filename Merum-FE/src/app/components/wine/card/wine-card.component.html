<div class="wine-card" *ngIf="wine">
    <div class="wine-card-image-container">
        <img [src]="wine.picturePath" alt="{{ wine.name }}">
    </div>
    <h2 class="wine-header-text" style="margin-bottom:5px"><a [routerLink]="['/borok',wine.id]">{{ wine.name }}</a></h2>
    <h3 class="wine-header-text" style="margin-top:5px">{{ wine.year }}</h3>
    <p>Alcohol Content: {{ wine.alcohol }}%</p> 
    <p>Location: {{ wine.location.name }}</p>
</div>
